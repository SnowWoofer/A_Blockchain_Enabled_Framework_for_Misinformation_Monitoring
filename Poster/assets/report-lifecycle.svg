<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 648 362" width="648" height="362" font-family="Arimo, Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Report lifecycle</title>
  <desc id="d">A submitted report starts PENDING and moves to UNDER REVIEW with its first fact-check. It becomes FINAL with label 0 or 1 once floor(E/2) + 1 eligible organisations agree on one label, or DISPUTED if all E have voted without a majority. An official can mark a PENDING or UNDER REVIEW report EXPIRED once its 72-hour window has passed.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#33475B"/>
    </marker>
  </defs>

  <!-- start -->
  <circle cx="262" cy="11" r="10" fill="#003366"/>

  <!-- open states -->
  <rect x="137" y="62" width="250" height="60" rx="8" fill="#E9EEF4" stroke="#C3CEDB" stroke-width="1.4"/>
  <text x="262" y="87" font-size="19" font-weight="700" fill="#003366" text-anchor="middle">PENDING</text>
  <text x="262" y="110" font-size="16" fill="#4D4D4D" text-anchor="middle">72 h review window opens</text>
  <rect x="137" y="164" width="250" height="60" rx="8" fill="#E9EEF4" stroke="#C3CEDB" stroke-width="1.4"/>
  <text x="262" y="189" font-size="19" font-weight="700" fill="#003366" text-anchor="middle">UNDER REVIEW</text>
  <text x="262" y="212" font-size="16" fill="#4D4D4D" text-anchor="middle">eligible orgs vote 0 or 1</text>

  <!-- terminal states -->
  <rect x="0" y="292" width="196" height="68" rx="8" fill="#003366"/>
  <text x="98" y="320" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle">FINAL</text>
  <text x="98" y="343" font-size="16" fill="#DCE5EF" text-anchor="middle">label 0 or 1</text>
  <rect x="226" y="292" width="196" height="68" rx="8" fill="#FBF1DE" stroke="#D99A2B" stroke-width="2"/>
  <text x="324" y="320" font-size="19" font-weight="700" fill="#1A1A1A" text-anchor="middle">DISPUTED</text>
  <text x="324" y="343" font-size="16" fill="#4D4D4D" text-anchor="middle">no majority label</text>
  <rect x="452" y="292" width="196" height="68" rx="8" fill="#FFFFFF" stroke="#9AA3AF" stroke-width="1.6"/>
  <text x="550" y="320" font-size="19" font-weight="700" fill="#1A1A1A" text-anchor="middle">EXPIRED</text>
  <text x="550" y="343" font-size="16" fill="#4D4D4D" text-anchor="middle">set by an official</text>

  <!-- transitions -->
  <g stroke="#33475B" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <line x1="262" y1="21" x2="262" y2="60"/>
    <line x1="262" y1="122" x2="262" y2="162"/>
    <path d="M137,180 C97,176 97,212 135,208"/>
    <line x1="170" y1="224" x2="170" y2="290"/>
    <line x1="330" y1="224" x2="330" y2="290"/>
    <polyline points="387,92 550,92 550,290"/>
  </g>
  <line x1="387" y1="194" x2="550" y2="194" stroke="#33475B" stroke-width="2"/>
  <circle cx="550" cy="194" r="4" fill="#33475B"/>

  <!-- transition labels -->
  <g font-size="16" fill="#2D3B48">
    <text x="272" y="46">submit report</text>
    <text x="272" y="147">first fact-check</text>
    <text x="90" y="199" text-anchor="end">next vote</text>
    <text x="162" y="252" text-anchor="end">⌊E/2⌋ + 1 votes</text>
    <text x="162" y="272" text-anchor="end">on one label</text>
    <text x="338" y="252">all E voted,</text>
    <text x="338" y="272">no majority</text>
    <text x="468" y="82" text-anchor="middle">after 72 h</text>
  </g>
</svg>
