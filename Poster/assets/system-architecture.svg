<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 648 744" width="648" height="744" font-family="Arimo, Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">System architecture</title>
  <desc id="d">Claims enter an ingestion service, pass through Kafka and the AfroXLM-R detection service, and the submission service sends each labelled claim to the REST gateway. Fact-checking organisations review and vote through the fact-checking service, which also calls the REST gateway, their sole point of contact. The gateway reaches Hyperledger Fabric through the SDK sidecar and stores claim documents in an IPFS swarm through a thin storage service.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#33475B"/>
    </marker>
  </defs>

  <!-- groups -->
  <rect x="0" y="92" width="196" height="464" rx="8" fill="#F4F6F9" stroke="#5B7793" stroke-width="1.6" stroke-dasharray="7 6"/>
  <text x="12" y="546" font-size="15" font-weight="700" letter-spacing="1.2" fill="#003366">AI PIPELINE</text>
  <rect x="0" y="600" width="420" height="140" rx="8" fill="#F4F6F9" stroke="#5B7793" stroke-width="1.6" stroke-dasharray="7 6"/>
  <text x="14" y="623" font-size="15" font-weight="700" letter-spacing="1.2" fill="#003366">HYPERLEDGER FABRIC 2.5</text>
  <rect x="440" y="600" width="208" height="140" rx="8" fill="#F4F6F9" stroke="#5B7793" stroke-width="1.6" stroke-dasharray="7 6"/>
  <text x="452" y="623" font-size="15" font-weight="700" letter-spacing="1.2" fill="#003366">IPFS SWARM</text>

  <!-- sources -->
  <rect x="0" y="0" width="196" height="56" rx="8" fill="#FFFFFF" stroke="#9AA3AF" stroke-width="1.6"/>
  <text x="98" y="24" font-size="19" font-weight="700" fill="#1A1A1A" text-anchor="middle">Claim feed</text>
  <text x="98" y="46" font-size="16" fill="#4D4D4D" text-anchor="middle">synthetic statements</text>
  <rect x="236" y="0" width="412" height="56" rx="8" fill="#FFFFFF" stroke="#9AA3AF" stroke-width="1.6"/>
  <text x="442" y="35" font-size="19" font-weight="700" fill="#1A1A1A" text-anchor="middle">Fact-checking organisations</text>

  <!-- application layer -->
  <rect x="12" y="106" width="172" height="70" rx="8" fill="#E9EEF4" stroke="#C3CEDB" stroke-width="1.4"/>
  <text x="98" y="134" font-size="19" font-weight="700" fill="#003366" text-anchor="middle">Ingestion</text>
  <text x="98" y="158" font-size="16" fill="#4D4D4D" text-anchor="middle">publishes claims</text>
  <rect x="236" y="106" width="412" height="70" rx="8" fill="#E9EEF4" stroke="#C3CEDB" stroke-width="1.4"/>
  <text x="442" y="134" font-size="19" font-weight="700" fill="#003366" text-anchor="middle">Fact-checking service</text>
  <text x="442" y="158" font-size="16" fill="#4D4D4D" text-anchor="middle">review interface over pending claims</text>

  <rect x="12" y="226" width="172" height="66" rx="8" fill="#E9EEF4" stroke="#C3CEDB" stroke-width="1.4"/>
  <text x="98" y="253" font-size="19" font-weight="700" fill="#003366" text-anchor="middle">Kafka</text>
  <text x="98" y="277" font-size="16" fill="#4D4D4D" text-anchor="middle">raw · flagged topics</text>
  <rect x="12" y="342" width="172" height="66" rx="8" fill="#FBF1DE" stroke="#D99A2B" stroke-width="2"/>
  <text x="98" y="369" font-size="19" font-weight="700" fill="#1A1A1A" text-anchor="middle">Detection</text>
  <text x="98" y="393" font-size="16" fill="#4D4D4D" text-anchor="middle">AfroXLM-R · batching</text>
  <rect x="12" y="458" width="172" height="66" rx="8" fill="#E9EEF4" stroke="#C3CEDB" stroke-width="1.4"/>
  <text x="98" y="485" font-size="19" font-weight="700" fill="#003366" text-anchor="middle">Submission</text>
  <text x="98" y="509" font-size="16" fill="#4D4D4D" text-anchor="middle">reports to gateway</text>

  <!-- persistence layer -->
  <rect x="236" y="226" width="412" height="85" rx="8" fill="#003366"/>
  <text x="442" y="254" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle">REST gateway</text>
  <text x="442" y="277" font-size="16" fill="#DCE5EF" text-anchor="middle">sole contact point for organisations</text>
  <text x="442" y="298" font-size="16" fill="#DCE5EF" text-anchor="middle">authenticates and routes requests</text>

  <rect x="256" y="386" width="180" height="75" rx="8" fill="#E9EEF4" stroke="#C3CEDB" stroke-width="1.4"/>
  <text x="346" y="415" font-size="19" font-weight="700" fill="#003366" text-anchor="middle">SDK sidecar</text>
  <text x="346" y="439" font-size="16" fill="#4D4D4D" text-anchor="middle">Fabric Gateway SDK</text>
  <rect x="470" y="386" width="178" height="75" rx="8" fill="#E9EEF4" stroke="#C3CEDB" stroke-width="1.4"/>
  <text x="559" y="415" font-size="19" font-weight="700" fill="#003366" text-anchor="middle">Storage service</text>
  <text x="559" y="439" font-size="16" fill="#4D4D4D" text-anchor="middle">thin IPFS access</text>

  <rect x="14" y="637" width="110" height="88" rx="7" fill="#FFFFFF" stroke="#C3CEDB" stroke-width="1.4"/>
  <text x="69" y="674" font-size="19" font-weight="700" fill="#003366" text-anchor="middle">Peers</text>
  <text x="69" y="698" font-size="16" fill="#4D4D4D" text-anchor="middle">+ LevelDB</text>
  <rect x="136" y="637" width="100" height="88" rx="7" fill="#FFFFFF" stroke="#C3CEDB" stroke-width="1.4"/>
  <text x="186" y="674" font-size="19" font-weight="700" fill="#003366" text-anchor="middle">Orderer</text>
  <text x="186" y="698" font-size="16" fill="#4D4D4D" text-anchor="middle">Raft</text>
  <rect x="248" y="637" width="158" height="88" rx="7" fill="#003366"/>
  <text x="327" y="674" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle">Chaincode</text>
  <text x="327" y="698" font-size="16" fill="#DCE5EF" text-anchor="middle">RBAC · majority</text>
  <rect x="454" y="637" width="180" height="88" rx="7" fill="#FFFFFF" stroke="#C3CEDB" stroke-width="1.4"/>
  <text x="544" y="674" font-size="19" font-weight="700" fill="#003366" text-anchor="middle">3 Kubo nodes</text>
  <text x="544" y="698" font-size="16" fill="#4D4D4D" text-anchor="middle">claim documents</text>

  <!-- flows -->
  <g stroke="#33475B" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <line x1="98" y1="56" x2="98" y2="104"/>
    <line x1="442" y1="56" x2="442" y2="104"/>
    <line x1="98" y1="176" x2="98" y2="224"/>
    <line x1="442" y1="176" x2="442" y2="224"/>
    <line x1="98" y1="292" x2="98" y2="340"/>
    <line x1="98" y1="408" x2="98" y2="456"/>
    <polyline points="184,491 216,491 216,290 234,290"/>
    <line x1="346" y1="311" x2="346" y2="384"/>
    <line x1="559" y1="311" x2="559" y2="384"/>
    <line x1="346" y1="461" x2="346" y2="635"/>
    <line x1="610" y1="461" x2="610" y2="635"/>
  </g>

  <!-- flow labels -->
  <g font-size="16" fill="#2D3B48">
    <text x="452" y="86">review · vote</text>
    <text x="106" y="205">publish</text>
    <text x="452" y="205">REST · API key or JWT</text>
    <text x="106" y="321">claims.raw</text>
    <text x="106" y="437">via Kafka</text>
    <text x="232" y="400" transform="rotate(-90 232 400)" text-anchor="middle">submit report</text>
    <text x="356" y="352">invoke · query</text>
    <text x="569" y="352">documents</text>
    <text x="356" y="552">endorse · commit</text>
    <text x="602" y="552" text-anchor="end">add / cat</text>
  </g>
</svg>
