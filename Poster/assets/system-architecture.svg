<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 648 860" width="648" height="860" font-family="Arimo, Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">System architecture</title>
  <desc id="d">Browsers reach only the nginx edge over HTTPS. The edge routes tips to claim intake, API calls to the gateway and reviews to the fact-checking service. Claims pass through Kafka and the AfroXLM-R engine as signed messages, then the submission worker sends them to the gateway with a scoped key. The gateway signs ledger transactions per role through the Fabric SDK and stores claim documents in a private IPFS swarm.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#33475B"/>
    </marker>
  </defs>

  <!-- groups -->
  <rect x="0" y="330" width="196" height="350" rx="8" fill="#F4F6F9" stroke="#5B7793" stroke-width="1.6" stroke-dasharray="7 6"/>
  <text x="12" y="674" font-size="15" font-weight="700" letter-spacing="1.2" fill="#003366">AI SCREENING</text>
  <rect x="0" y="715" width="420" height="140" rx="8" fill="#F4F6F9" stroke="#5B7793" stroke-width="1.6" stroke-dasharray="7 6"/>
  <text x="14" y="738" font-size="15" font-weight="700" letter-spacing="1.2" fill="#003366">HYPERLEDGER FABRIC</text>
  <rect x="440" y="715" width="208" height="140" rx="8" fill="#F4F6F9" stroke="#5B7793" stroke-width="1.6" stroke-dasharray="7 6"/>
  <text x="452" y="738" font-size="15" font-weight="700" letter-spacing="1.2" fill="#003366">IPFS SWARM</text>

  <!-- people -->
  <rect x="0" y="0" width="648" height="52" rx="8" fill="#FFFFFF" stroke="#9AA3AF" stroke-width="1.6"/>
  <text x="324" y="33" font-size="19" font-weight="700" fill="#1A1A1A" text-anchor="middle">Public · fact-checkers · officials</text>

  <!-- edge: the only public entry point -->
  <rect x="0" y="100" width="648" height="70" rx="8" fill="#003366"/>
  <text x="324" y="128" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle">Edge proxy · nginx</text>
  <text x="324" y="152" font-size="16" fill="#DCE5EF" text-anchor="middle">TLS · rate limits · security headers · web app</text>

  <!-- service row -->
  <rect x="0" y="220" width="196" height="85" rx="8" fill="#E9EEF4" stroke="#C3CEDB" stroke-width="1.4"/>
  <text x="98" y="248" font-size="19" font-weight="700" fill="#003366" text-anchor="middle">Claim intake</text>
  <text x="98" y="271" font-size="16" fill="#4D4D4D" text-anchor="middle">public tips</text>
  <text x="98" y="292" font-size="16" fill="#4D4D4D" text-anchor="middle">signs messages</text>

  <rect x="236" y="220" width="180" height="85" rx="8" fill="#003366"/>
  <text x="326" y="248" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle">Gateway</text>
  <text x="326" y="271" font-size="16" fill="#DCE5EF" text-anchor="middle">accounts · roles</text>
  <text x="326" y="292" font-size="16" fill="#DCE5EF" text-anchor="middle">audit · public API</text>

  <rect x="470" y="220" width="178" height="85" rx="8" fill="#E9EEF4" stroke="#C3CEDB" stroke-width="1.4"/>
  <text x="559" y="248" font-size="19" font-weight="700" fill="#003366" text-anchor="middle">Fact-checking</text>
  <text x="559" y="271" font-size="16" fill="#4D4D4D" text-anchor="middle">blind review</text>
  <text x="559" y="292" font-size="16" fill="#4D4D4D" text-anchor="middle">caller's own token</text>

  <!-- AI pipeline -->
  <rect x="12" y="366" width="172" height="66" rx="8" fill="#E9EEF4" stroke="#C3CEDB" stroke-width="1.4"/>
  <text x="98" y="393" font-size="19" font-weight="700" fill="#003366" text-anchor="middle">Kafka</text>
  <text x="98" y="417" font-size="16" fill="#4D4D4D" text-anchor="middle">two signed topics</text>
  <rect x="12" y="478" width="172" height="66" rx="8" fill="#FBF1DE" stroke="#D99A2B" stroke-width="2"/>
  <text x="98" y="505" font-size="19" font-weight="700" fill="#1A1A1A" text-anchor="middle">AI engine</text>
  <text x="98" y="529" font-size="16" fill="#4D4D4D" text-anchor="middle">AfroXLM-R (LoRA)</text>
  <rect x="12" y="590" width="172" height="66" rx="8" fill="#E9EEF4" stroke="#C3CEDB" stroke-width="1.4"/>
  <text x="98" y="617" font-size="19" font-weight="700" fill="#003366" text-anchor="middle">Submission</text>
  <text x="98" y="641" font-size="16" fill="#4D4D4D" text-anchor="middle">de-duplicates</text>

  <!-- ledger clients -->
  <rect x="256" y="390" width="180" height="75" rx="8" fill="#E9EEF4" stroke="#C3CEDB" stroke-width="1.4"/>
  <text x="346" y="419" font-size="19" font-weight="700" fill="#003366" text-anchor="middle">Fabric SDK</text>
  <text x="346" y="443" font-size="16" fill="#4D4D4D" text-anchor="middle">signs per role</text>
  <rect x="470" y="390" width="178" height="75" rx="8" fill="#E9EEF4" stroke="#C3CEDB" stroke-width="1.4"/>
  <text x="559" y="419" font-size="19" font-weight="700" fill="#003366" text-anchor="middle">IPFS bridge</text>
  <text x="559" y="443" font-size="16" fill="#4D4D4D" text-anchor="middle">CID-checked</text>

  <!-- ledger and storage -->
  <rect x="14" y="752" width="120" height="88" rx="7" fill="#FFFFFF" stroke="#C3CEDB" stroke-width="1.4"/>
  <text x="74" y="789" font-size="19" font-weight="700" fill="#003366" text-anchor="middle">Peers</text>
  <text x="74" y="813" font-size="16" fill="#4D4D4D" text-anchor="middle">+ CouchDB</text>
  <rect x="148" y="752" width="120" height="88" rx="7" fill="#FFFFFF" stroke="#C3CEDB" stroke-width="1.4"/>
  <text x="208" y="789" font-size="19" font-weight="700" fill="#003366" text-anchor="middle">Orderer</text>
  <text x="208" y="813" font-size="16" fill="#4D4D4D" text-anchor="middle">Raft</text>
  <rect x="282" y="752" width="124" height="88" rx="7" fill="#003366"/>
  <text x="344" y="789" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle">Chaincode</text>
  <text x="344" y="813" font-size="16" fill="#DCE5EF" text-anchor="middle">ABAC · votes</text>
  <rect x="454" y="752" width="180" height="88" rx="7" fill="#FFFFFF" stroke="#C3CEDB" stroke-width="1.4"/>
  <text x="544" y="789" font-size="19" font-weight="700" fill="#003366" text-anchor="middle">3 kubo nodes</text>
  <text x="544" y="813" font-size="16" fill="#4D4D4D" text-anchor="middle">private swarm key</text>

  <!-- flows -->
  <g stroke="#33475B" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <line x1="324" y1="52" x2="324" y2="98"/>
    <line x1="98" y1="170" x2="98" y2="218"/>
    <line x1="326" y1="170" x2="326" y2="218"/>
    <line x1="559" y1="170" x2="559" y2="218"/>
    <line x1="470" y1="262" x2="418" y2="262"/>
    <line x1="98" y1="305" x2="98" y2="364"/>
    <line x1="98" y1="432" x2="98" y2="476"/>
    <line x1="98" y1="544" x2="98" y2="588"/>
    <polyline points="184,623 216,623 216,282 234,282"/>
    <line x1="326" y1="305" x2="346" y2="388"/>
    <line x1="400" y1="305" x2="540" y2="388"/>
    <line x1="346" y1="465" x2="346" y2="750"/>
    <line x1="610" y1="465" x2="610" y2="750"/>
  </g>

  <!-- flow labels -->
  <g font-size="16" fill="#2D3B48">
    <text x="334" y="83">HTTPS only</text>
    <text x="106" y="200">/tips</text>
    <text x="334" y="200">/api</text>
    <text x="567" y="200">/fc</text>
    <text x="106" y="322">HMAC-signed</text>
    <text x="106" y="460">claims.raw</text>
    <text x="106" y="572">via Kafka</text>
    <text x="232" y="470" transform="rotate(-90 232 470)" text-anchor="middle">scoped API key</text>
    <text x="478" y="336">internal token</text>
    <text x="356" y="600">signed transactions</text>
    <text x="602" y="600" text-anchor="end">add / cat</text>
  </g>
</svg>
