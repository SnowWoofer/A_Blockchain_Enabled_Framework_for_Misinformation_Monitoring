# Reference template only. The runner generates network.json for the named deployment.
name: GENERATED-PER-RUN
version: 2.0.0
caliper:
  blockchain: fabric
info:
  StateDB: selected-at-startup
  Organisations: selected-at-startup
  Endorsement: 2-of-N
channels:
- channelName: mychannel
  contracts:
  - id: misinformation
organizations:
- mspid: Org1MSP
  identities:
    certificates:
    - name: official1
      clientPrivateKey:
        path: /identity/keystore/key.pem
      clientSignedCert:
        path: /identity/signcerts/cert.pem
  peers:
  - endpoint: peer1:7051
    tlsCACerts:
      path: /peer-tls.pem
    grpcOptions:
      ssl-target-name-override: peer0.org1.example.com
