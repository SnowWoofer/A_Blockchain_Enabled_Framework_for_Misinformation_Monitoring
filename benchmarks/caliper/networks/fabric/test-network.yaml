name: Caliper Benchmarks
version: "2.0.0"

caliper:
  blockchain: fabric

info:
  Framework: Misinformation Monitoring Consortium
  Channel: mychannel
  Chaincode: misinformation v2.1
  Endorsement: OutOf(2, Org1MSP, Org2MSP, Org3MSP)
  StateDB: CouchDB

channels:
  - channelName: mychannel
    contracts:
      - id: misinformation

organizations:
  - mspid: Org1MSP
    identities:
      certificates:
        - name: 'Admin'
          admin: true
          clientPrivateKey:
            path: '/crypto/peerOrganizations/org1.example.com/users/Admin@org1.example.com/msp/keystore/priv_sk'
          clientSignedCert:
            path: '/crypto/peerOrganizations/org1.example.com/users/Admin@org1.example.com/msp/signcerts/Admin@org1.example.com-cert.pem'
    connectionProfile:
      path: 'networks/fabric/ccp.json'
      discover: true
