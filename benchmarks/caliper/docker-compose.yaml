# Optional explicit configuration; the normal runner generates its Docker invocation.
# No default shared network or private-key directory is assumed.
services:
  caliper:
    image: misinfo-caliper:0.7.1-v3
    command: ["launch", "manager", "--caliper-workspace", "/caliper/workspace", "--caliper-benchconfig", "benchmark.json", "--caliper-networkconfig", "network.json", "--caliper-flow-only-test"]
    environment:
      CALIPER_REPORTPATH: /caliper/workspace/report.html
    volumes:
      - ${CALIPER_RUN_DIR:?Use run-caliper.sh or supply a generated run directory}:/caliper/workspace
      - ${CALIPER_CLIENT_MSP:?Supply only the official client MSP}:/identity:ro
      - ${CALIPER_PEER_TLS:?Supply the gateway peer TLS CA}:/peer-tls.pem:ro
    networks: [deployment]
networks:
  deployment:
    external: true
    name: ${CALIPER_NETWORK:?Supply the named deployment network}
