test:
  name: counted-writes-then-reads
  description: Reference defaults; run-caliper.sh generates actual settings per run.
  workers:
    number: 2
  rounds:
  - label: write
    txNumber: 1000
    rateControl:
      type: workload/count-fixed-load.js
      opts:
        transactionLoad: 100
        startTps: 25
    workload:
      module: workload/submitReport.js
      arguments:
        label: write
        runId: GENERATED-PER-RUN
        transactionCount: 1000
        workerCount: 2
        rejectWrites: false
  - label: read
    txNumber: 1000
    rateControl:
      type: workload/count-fixed-load.js
      opts:
        transactionLoad: 100
        startTps: 25
    workload:
      module: workload/queryAllReports.js
      arguments:
        label: read
        runId: GENERATED-PER-RUN
        transactionCount: 1000
        workerCount: 2
        rejectWrites: false
