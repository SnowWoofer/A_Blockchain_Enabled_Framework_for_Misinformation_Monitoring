proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header Connection "";
# The backends trust X-Real-IP (TRUST_PROXY_HEADERS); it is always set here
# from the TCP peer, never from anything the client sent.
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For "";
proxy_set_header X-Forwarded-Proto https;
# Ledger commits through Fabric can take several seconds.
proxy_connect_timeout 5s;
proxy_read_timeout 90s;
# The edge sets these for every response; drop upstream copies to avoid duplicates.
proxy_hide_header X-Frame-Options;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header Referrer-Policy;
proxy_hide_header Content-Security-Policy;
proxy_hide_header Cross-Origin-Resource-Policy;
proxy_hide_header Server;
