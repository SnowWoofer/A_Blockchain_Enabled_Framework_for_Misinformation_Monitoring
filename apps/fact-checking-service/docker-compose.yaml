services:
  fact-checking-service:
    build: .
    container_name: fact-checking-service
    environment:
      # Reached by container name on misinfo_net (shared with blockchain_gateway).
      BLOCKCHAIN_API_BASE: ${BLOCKCHAIN_API_BASE:-http://blockchain-gateway:8000}
      # No ORG_API_KEYS any more: this service holds no credentials and
      # forwards each caller's own Bearer token / X-API-Key to the gateway.
    ports:
      # The web client reaches it through the edge proxy at /fc/; host access
      # is for local tooling only.
      - "127.0.0.1:8002:8000"
    networks:
      - misinfo_net
    restart: unless-stopped

networks:
  misinfo_net:
    external: true
