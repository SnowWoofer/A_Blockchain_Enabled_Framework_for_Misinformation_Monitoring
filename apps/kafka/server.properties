# Single-node KRaft config: this node acts as both broker and controller,
# so the container needs no ZooKeeper and no second node to form a quorum.
process.roles=broker,controller
node.id=1
controller.quorum.voters=1@localhost:9093

# Two client listeners: PLAINTEXT is what other containers (e.g. the
# flagging-engine) resolve via the "kafka" service name on the docker network;
# EXTERNAL is what host-machine tools (a local producer/consumer for testing)
# connect to. Kafka returns the *advertised* address in its metadata response,
# so a single "localhost" advertisement (the old config) breaks every
# container client after the first handshake - they'd try to reconnect to
# themselves.
listeners=PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
advertised.listeners=PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
controller.listener.names=CONTROLLER
listener.security.protocol.map=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
inter.broker.listener.name=PLAINTEXT

log.dirs=/var/lib/kafka/data

num.network.threads=3
num.io.threads=8
socket.send.buffer.bytes=102400
socket.receive.buffer.bytes=102400
socket.request.max.bytes=104857600

num.partitions=1
offsets.topic.replication.factor=1
transaction.state.log.replication.factor=1
transaction.state.log.min.isr=1

log.retention.hours=168
log.segment.bytes=1073741824
log.retention.check.interval.ms=300000
