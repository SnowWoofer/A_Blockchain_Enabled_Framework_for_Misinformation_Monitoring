include:
  - apps/kafka/docker-compose.yml
  - apps/claim-ingest-worker/docker-compose.yaml
  - apps/flagging-engine/docker-compose.yaml
  - apps/submission-worker/docker-compose.yaml
  - apps/fact-checking-service/docker-compose.yaml
  - apps/web-client/docker-compose.yaml

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - kafka_net
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    depends_on:
      - prometheus
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?run blockchain/scripts/gen-secrets.sh}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - kafka_net
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
