# Local-dev convenience: `docker compose up -d --build` brings every
# service up together in one shot. Each service is independently
# deployable on its own — see apps/*/docker-compose.yaml — this file just
# includes all of them (so this repo has exactly one place that knows how to
# run everything at once) plus the environment-level infra that isn't one of
# "our" services (Prometheus/Grafana, no Dockerfile of their own).
#
# The gateway services (fabric_gateway, ipfs_gateway, blockchain_gateway) are
# NOT included here: they are provisioned by `./startup.sh` (which generates
# crypto, creates the channel, installs/approves/commits chaincode, bootstraps
# API keys and brings the gateways up with the correct ORGS env for the
# deployed consortium size). Recreating them from this file would clobber that
# env with the compose default — the blockchain gateway would then reject
# fact-check votes from any org beyond the default list (HTTP 400 "unknown
# signing org"). Bring the app layer up after startup.sh via this file; it
# shares the same kafka_net.
#
# Prerequisite before running this file: `./startup.sh` (which calls
# `blockchain/scripts/ensure-networks.sh` automatically).
# (idempotent — safe to re-run). kafka_net is shared by several
# independently-deployable services and none of their individual compose
# files can safely "own" creating it once any of them marks it external, so
# it has to already exist before `docker compose up` runs. Note:
# startup.sh calls ensure-networks.sh automatically.
include:
  - apps/kafka/docker-compose.yml
  - apps/claim-ingest-worker/docker-compose.yaml
  - apps/flagging-engine/docker-compose.yaml
  - apps/submission-worker/docker-compose.yaml
  - apps/fact-checking-service/docker-compose.yaml

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - kafka_net
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    depends_on:
      - prometheus
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    networks:
      - kafka_net
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
